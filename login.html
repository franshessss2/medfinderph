<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — MedFinder PH</title>
  <meta name="description" content="Log in to MedFinder PH to reserve medicine and track your pickups." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">
        <svg class="brand-mark" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="34" height="34" rx="10" fill="#0D9488"/>
          <rect x="14.5" y="8" width="5" height="18" rx="2.5" fill="#ffffff"/>
          <rect x="8" y="14.5" width="18" height="5" rx="2.5" fill="#ffffff"/>
          <circle cx="27.5" cy="6.5" r="4" fill="#ffffff"/>
          <circle cx="27.5" cy="6.5" r="2.4" fill="#15803D"/>
        </svg>
        MedFinder PH
      </a>
      <div class="nav-actions">
        <span class="auth-switch-text">New here?</span>
        <a class="btn btn-ghost" href="signup.html">Sign up</a>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="container auth-container">
      <div class="card auth-card">
        <h1>Log in</h1>
        <p class="auth-sub">Check your reservations and pick up where you left off.</p>

        <p class="form-alert form-alert-info" id="form-info" hidden></p>
        <p class="form-alert form-alert-error" id="form-error" role="alert" hidden></p>

        <form id="login-form" novalidate data-requires-network>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required />
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Log in</button>
        </form>

        <p class="auth-foot">Don't have an account? <a href="signup.html">Sign up</a></p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/connection.js"></script>
  <script defer src="js/reveal.js"></script>
  <script type="module" src="js/login.js"></script>
</body>
</html>
